<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot BCTC Vinamilk</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1b2a38; --mute:#5b6b7a; --line:#dde3ea; --accent:#0b3c5d; --accent-ink:#fff; --user:#e8f0f7; --warn:#fff4e5; --warn-ink:#7a4a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1720; --card:#16212d; --ink:#e6edf3; --mute:#93a4b5; --line:#2a3947; --accent:#5aa6d6; --accent-ink:#0b1620; --user:#1d2f40; --warn:#3a2c10; --warn-ink:#ffd58a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p.sub { margin:0 0 16px; color:var(--mute); font-size:14px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { padding:8px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; font:inherit; }
  .tab[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .panel[hidden] { display:none; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { padding:6px 10px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; cursor:pointer; font-size:14px; text-align:left; }
  #log { display:flex; flex-direction:column; gap:10px; min-height:120px; margin-bottom:12px; }
  .msg { padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { background:var(--user); align-self:flex-end; max-width:85%; }
  .msg.err { background:var(--warn); color:var(--warn-ink); }
  .src { margin-top:8px; font-size:14px; color:var(--mute); white-space:normal; }
  .src ul { margin:4px 0 0 18px; padding:0; }
  .src li { margin-bottom:8px; }
  .src summary { cursor:pointer; color:var(--accent); }
  .src a.pg { position:relative; display:block; }
  .src .hl { position:absolute; border:2px solid #e11d48; background:rgba(225,29,72,.12); border-radius:3px; pointer-events:none; }
  .src img { display:block; max-width:100%; margin-top:6px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .warn { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--warn); color:var(--warn-ink); font-size:14px; white-space:normal; }
  .charts { margin-top:10px; display:flex; flex-direction:column; gap:14px; white-space:normal; }
  .chartbox { border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card); }
  .chartbox h3 { margin:0 0 6px; font-size:15px; }
  .cv { position:relative; height:240px; }
  .cv-note { font-size:13px; color:var(--mute); margin:4px 0 0; }
  .tbl { overflow-x:auto; margin-top:8px; }
  .tbl table { border-collapse:collapse; width:100%; font-size:14px; }
  .tbl caption { text-align:left; color:var(--mute); font-size:13px; padding:2px 0; }
  .tbl th, .tbl td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; }
  .tbl th.n, .tbl td.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tbl tfoot td { font-weight:600; }
  .fb { margin-top:8px; display:flex; align-items:center; gap:8px; font-size:14px; color:var(--mute); white-space:normal; }
  .fb button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:2px 10px; cursor:pointer; font-size:16px; }
  .fb button:disabled { opacity:.5; cursor:default; }
  @media (max-width:520px) { .cv { height:200px; } .wrap { padding:10px; } }
  form { display:flex; gap:8px; }
  input, select { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  input[type=text] { flex:1; min-width:0; }
  button.go { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font:inherit; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:default; }
  button.link { background:none; border:0; color:var(--mute); cursor:pointer; font:inherit; padding:0; text-decoration:underline; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  #lookup-out { padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); white-space:pre-wrap; }
  a { color:var(--accent); }
  footer { margin-top:20px; font-size:13px; color:var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chatbot BCTC Vinamilk</h1>
  <p class="sub">Hỏi đáp trên báo cáo tài chính hợp nhất quý 1/2025 – quý 2/2026. Số liệu lấy từ PDF bằng OCR và đã đối chiếu; câu trả lời kèm nguồn.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-chat" aria-selected="true" aria-controls="p-chat">Hỏi đáp</button>
    <button class="tab" role="tab" id="t-lookup" aria-selected="false" aria-controls="p-lookup">Tra số trực tiếp</button>
  </div>

  <section class="panel" id="p-chat" role="tabpanel" aria-labelledby="t-chat">
    <div class="chips" id="chips"></div>
    <div id="log" aria-live="polite"></div>
    <form id="chat-form">
      <input type="text" id="q" maxlength="500" placeholder="Hỏi về số liệu, tỷ số hoặc nội dung thuyết minh…" aria-label="Câu hỏi" autocomplete="off">
      <button class="go" id="send" type="submit">Gửi</button>
    </form>
    <p style="margin:8px 0 0"><button class="link" id="reset" type="button">Cuộc trò chuyện mới</button></p>
  </section>

  <section class="panel" id="p-lookup" role="tabpanel" aria-labelledby="t-lookup" hidden>
    <form id="lookup-form" class="row">
      <input type="text" id="metric" value="doanh thu thuần" aria-label="Chỉ tiêu" list="metric-list">
      <datalist id="metric-list">
        <option value="doanh thu thuần"><option value="giá vốn hàng bán"><option value="lợi nhuận gộp"><option value="lợi nhuận sau thuế">
        <option value="tổng tài sản"><option value="nợ phải trả"><option value="vốn chủ sở hữu"><option value="hàng tồn kho">
      </datalist>
      <select id="period" aria-label="Kỳ báo cáo">
        <option>Q1/2025</option><option>Q2/2025</option><option>Q3/2025</option><option>Q4/2025</option><option>Q1/2026</option><option selected>Q2/2026</option>
      </select>
      <select id="basis" aria-label="Cách tính">
        <option value="quy" selected>Riêng quý</option><option value="luy_ke">Lũy kế từ đầu năm</option>
      </select>
      <button class="go" type="submit">Tra số</button>
    </form>
    <div id="lookup-out">Chọn chỉ tiêu và kỳ rồi bấm Tra số.</div>
  </section>

  <footer>Chỉ cung cấp thông tin từ báo cáo tài chính, không phải khuyến nghị đầu tư.</footer>
</div>

<script>
const EXAMPLES = [
  "Doanh thu thuần quý 1/2026 là bao nhiêu và tăng bao nhiêu so với cùng kỳ?",
  "Biên lợi nhuận gộp quý 2/2026 so với quý 2/2025?",
  "Tổng tài sản và nợ phải trả tại 30/6/2026?",
  "ROE 6 tháng đầu năm 2026 là bao nhiêu?",
  "Dòng tiền từ hoạt động kinh doanh quý 4/2025?",
  "Xu hướng doanh thu thuần qua 6 quý?",
  "Vì sao lợi nhuận sau thuế quý 2/2026 tăng so với cùng kỳ?"
];
const $ = id => document.getElementById(id);
let history = [];          // [{role: "user"|"model", text}]
let busy = false;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(text) {       // văn bản đã escape; chỉ hỗ trợ **đậm** và gạch đầu dòng
  return esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  $("log").appendChild(d);
  d.scrollIntoView({ block: "end" });
  return d;
}
function sourcesHtml(list) {
  if (!list || !list.length) return "";
  const items = list.map(s => {
    const label = s.is_pdf ? "Mở PDF" : "Mở trang báo cáo Vinamilk";
    const page = s.page != null ? s.page : "không rõ";
    const rows = (s.rows && s.rows.length) ? `<div>${esc(s.rows.join("; "))}</div>` : "";
    const boxes = (s.boxes || []).map(b => `<span class="hl" style="left:${b[0] * 100}%;top:${b[1] * 100}%;width:${b[2] * 100}%;height:${b[3] * 100}%"></span>`).join("");
    const img = s.image ? `<details><summary>Xem trang PDF dẫn chứng</summary><a class="pg" href="${esc(s.image)}" target="_blank" rel="noopener noreferrer"><img src="${esc(s.image)}" loading="lazy" alt="Trang ${esc(String(page))} của ${esc(s.doc)}">${boxes}</a></details>` : "";
    return `<li>${esc(s.doc)} · ${esc(s.statement || "")} · trang PDF ${esc(String(page))} · <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${label}</a>${rows}${img}</li>`;
  }).join("");
  return `<div class="src"><strong>Nguồn tham khảo</strong><ul>${items}</ul></div>`;
}

// ---- định dạng số kiểu Việt Nam (dấu chấm nghìn, dấu phẩy thập phân), khớp với phía máy chủ
function vn(x, nd = 1) {
  const a = Math.abs(x).toFixed(nd), [i, f] = a.split(".");
  return (x < 0 && Number(a) !== 0 ? "-" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (f ? "," + f : "");
}
const signed = (x, nd = 1) => (x >= 0 ? "+" : "") + vn(x, nd);

// ---- biểu đồ: Chart.js nạp trễ (chỉ khi có biểu đồ cần vẽ), ghim phiên bản + SRI; tải lỗi thì vẫn còn bảng số liệu
const CHART_JS = { src: "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js", integrity: "sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" };
let chartLib = null;
function loadChartJs() {
  if (window.Chart) return Promise.resolve(window.Chart);
  chartLib = chartLib || new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = CHART_JS.src; el.integrity = CHART_JS.integrity; el.crossOrigin = "anonymous"; el.referrerPolicy = "no-referrer";
    el.onload = () => window.Chart ? resolve(window.Chart) : reject(new Error("no Chart"));
    el.onerror = () => { chartLib = null; reject(new Error("load")); };
    document.head.appendChild(el);
  });
  return chartLib;
}
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function drawChart(box, block) {
  const cv = document.createElement("div"); cv.className = "cv";
  const canvas = document.createElement("canvas");
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", `Biểu đồ ${block.title}: ` + block.rows.map(r => `${r.label} ${vn(r.value / block.scale)} ${block.unit}`).join("; "));
  cv.appendChild(canvas);
  box.insertBefore(cv, box.querySelector(".tbl"));
  loadChartJs().then(Chart => {
    new Chart(canvas, {
      type: "bar",
      data: { labels: block.rows.map(r => r.period || r.label),
              datasets: [{ label: block.unit, data: block.rows.map(r => +(r.value / block.scale).toFixed(1)), backgroundColor: cssVar("--accent"), borderRadius: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${vn(c.parsed.y)} ${block.unit}` } } },
        scales: { x: { ticks: { color: cssVar("--mute") }, grid: { display: false } },
                  y: { ticks: { color: cssVar("--mute"), callback: v => vn(v, 0) }, grid: { color: cssVar("--line") },
                       title: { display: true, text: block.unit, color: cssVar("--mute") } } } } });
  }).catch(() => {
    cv.remove();
    const n = document.createElement("p"); n.className = "cv-note"; n.textContent = "Không tải được thư viện vẽ biểu đồ; số liệu xem ở bảng bên dưới.";
    box.insertBefore(n, box.querySelector(".tbl"));
  });
}

function tableHtml(block) {
  const u = block.unit, k = block.kind;
  const head = k === "series" ? `<th>Kỳ</th><th class="n">Giá trị (${esc(u)})</th><th>Nguồn</th>`
             : k === "breakdown" ? `<th>Khoản mục</th><th class="n">Đóng góp (${esc(u)})</th>`
             : `<th>Kỳ</th><th class="n">Giá trị (${esc(u)})</th>`;
  const body = block.rows.map(r => {
    const num = k === "breakdown" ? signed(r.value / block.scale) : vn(r.value / block.scale);
    const src = k === "series" ? `<td>${r.source ? esc(`${r.source.doc} · trang PDF ${r.source.page}`) : ""}</td>` : "";
    return `<tr><td>${esc(r.label)}</td><td class="n">${num}</td>${src}</tr>`;
  }).join("");
  let foot = "";
  if (k === "comparison" && block.change != null)
    foot = `<tr><td>Thay đổi</td><td class="n">${signed(block.change / block.scale)}${block.growth != null ? ` (${signed(block.growth * 100)}%)` : ""}</td></tr>`;
  if (k === "breakdown" && block.change != null)
    foot = `<tr><td>Tổng chênh lệch</td><td class="n">${signed(block.change / block.scale)}</td></tr>`;
  return `<div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ""}</table></div>`;
}

function summaryHtml(b) {
  const m = b.summary;
  if (!m) return "";
  const t = x => `${esc(x.label)} (${vn(x.value / b.scale)} ${esc(b.unit)})`;
  const bare = x => esc(x.label.replace(/^tại /, ""));                          // "tại ngày 30/6/2026" -> "ngày 30/6/2026"
  const trend = `từ ${bare(m.first)} đến ${bare(m.last)}: ${signed(m.change / b.scale)} ${esc(b.unit)}` + (m.growth != null ? ` (${signed(m.growth * 100)}%)` : "");
  return `<p class="cv-note">Cao nhất: ${t(m.max)}; thấp nhất: ${t(m.min)}; ${trend}.</p>`;
}

function chartsEl(blocks) {
  if (!blocks || !blocks.length) return null;
  const wrap = document.createElement("div"); wrap.className = "charts";
  blocks.forEach(b => {
    const box = document.createElement("div"); box.className = "chartbox";
    box.innerHTML = `<h3>${esc(b.title)}</h3>` + summaryHtml(b) + tableHtml(b);
    wrap.appendChild(box);
    if (b.chart && b.rows.length >= 2) drawChart(box, b);
  });
  return wrap;
}

// ---- phản hồi 👍/👎 (chỉ gửi câu hỏi, câu trả lời, nhãn, thời điểm)
function feedbackEl(question, answer) {
  const bar = document.createElement("div"); bar.className = "fb";
  bar.innerHTML = `<span>Câu trả lời có hữu ích không?</span>
    <button type="button" data-l="up" aria-label="Hữu ích" title="Hữu ích">👍</button>
    <button type="button" data-l="down" aria-label="Chưa hữu ích" title="Chưa hữu ích">👎</button>`;
  bar.querySelectorAll("button").forEach(btn => btn.onclick = async () => {
    bar.querySelectorAll("button").forEach(x => x.disabled = true);
    try {
      const r = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, answer: answer.slice(0, 8000), label: btn.dataset.l, timestamp: new Date().toISOString() }) });
      if (!r.ok) throw new Error("feedback");
      bar.textContent = "Cảm ơn bạn đã phản hồi.";
    } catch (_) {
      bar.querySelectorAll("button").forEach(x => x.disabled = false);
      bar.querySelector("span").textContent = "Chưa gửi được phản hồi, bạn bấm lại nhé.";
    }
  });
  return bar;
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; $("send").disabled = true;
  add("user", esc(question));
  const wait = add("", "Đang tra cứu…");
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, history }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || "Đã có sự cố khi xử lý yêu cầu. Bạn thử lại sau nhé.");
    let html = fmt(data.answer);
    if (data.unsupported_numbers && data.unsupported_numbers.length)
      html += `<div class="warn">Các số sau trong câu trả lời <strong>không khớp</strong> kết quả tra cứu, hãy kiểm tra lại: ${esc(data.unsupported_numbers.join(", "))}</div>`;
    (data.warnings || []).forEach(w => { html += `<div class="warn">${esc(w)}</div>`; });
    wait.innerHTML = html;
    const ch = chartsEl(data.charts);
    if (ch) wait.appendChild(ch);
    wait.insertAdjacentHTML("beforeend", sourcesHtml(data.sources));
    wait.appendChild(feedbackEl(question, data.answer));
    history.push({ role: "user", text: question }, { role: "model", text: data.answer });
    history = history.slice(-12);
  } catch (e) {
    wait.className = "msg err";
    wait.textContent = e.message;
  } finally { busy = false; $("send").disabled = false; }
}

EXAMPLES.forEach(q => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = q;
  b.onclick = () => ask(q);
  $("chips").appendChild(b);
});
$("chat-form").onsubmit = e => { e.preventDefault(); const q = $("q").value; $("q").value = ""; ask(q); };
$("reset").onclick = () => { history = []; $("log").innerHTML = ""; };

$("lookup-form").onsubmit = async e => {
  e.preventDefault();
  $("lookup-out").textContent = "Đang tra…";
  try {
    const r = await fetch("/api/lookup", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ metric: $("metric").value, period: $("period").value, basis: $("basis").value }) });
    const data = await r.json().catch(() => ({}));
    $("lookup-out").textContent = r.ok ? data.text : (data.detail || "Không tra được, thử lại sau.");
  } catch (_) { $("lookup-out").textContent = "Không tra được, thử lại sau."; }
};


function pick(which) {
  for (const k of ["chat", "lookup"]) {
    $("t-" + k).setAttribute("aria-selected", String(k === which));
    $("p-" + k).hidden = k !== which;
  }
}
$("t-chat").onclick = () => pick("chat");
$("t-lookup").onclick = () => pick("lookup");
</script>
</body>
</html>
