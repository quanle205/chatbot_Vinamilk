# Cấu hình triển khai trên Render (Blueprint). Có thể bỏ qua file này và nhập tay cùng các giá trị trong giao diện Render.
services:
  - type: web
    name: chatbot-vinamilk
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GEMINI_API_KEY
        sync: false          # nhập khóa trong giao diện Render, không ghi vào git
